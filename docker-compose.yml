version: '3.9'

services:
  # ============================================================
  # PostgreSQL
  # ============================================================

  postgres:
    image: postgres:16-alpine
    container_name: flight-optimizer-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flight_optimizer

    ports:
      - '5433:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================
  # Redis
  # ============================================================

  redis:
    image: redis:7-alpine
    container_name: flight-optimizer-redis
    restart: unless-stopped

    ports:
      - '6379:6379'

    volumes:
      - redis_data:/data

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================
  # Database Migration
  # ============================================================

  migrate:
    build: ./backend
    profiles: ['tools']

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      NODE_ENV: production

      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/flight_optimizer

      JWT_ACCESS_SECRET: change_me_access_secret
      JWT_REFRESH_SECRET: change_me_refresh_secret

    command: ['npm', 'run', 'migrate']

  # ============================================================
  # Backend Tests
  # ============================================================

  backend-test:
    build:
      context: ./backend
      target: test

    container_name: flight-optimizer-backend-test
    profiles: ['test']

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./backend:/app
      - backend_test_node_modules:/app/node_modules

    environment:
      NODE_ENV: test

      # =========================
      # Database
      # =========================

      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/flight_optimizer_test
      PG_SSL: 'false'

      # =========================
      # JWT
      # =========================

      JWT_ACCESS_SECRET: test_access_secret
      JWT_REFRESH_SECRET: test_refresh_secret
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 30d

      # =========================
      # Flight Provider
      # =========================

      FLIGHT_PROVIDER: mock

      # =========================
      # Optimizer
      # =========================

      MAX_NEARBY_AIRPORTS: 3
      MAX_DATE_FLEX_DAYS: 3
      MAX_PERMUTATIONS: 500
      MAX_COUNTRIES_PER_TRIP: 4

      FLIGHT_CACHE_TTL_MINUTES: 20
      STATIC_CACHE_TTL_HOURS: 24

      # =========================
      # Sentry
      # =========================

      SENTRY_DSN: ''
      SENTRY_ENABLED: 'false'

      # =========================
      # Google OAuth
      # =========================

      GOOGLE_CLIENT_ID: test_google_client_id
      GOOGLE_CLIENT_SECRET: test_google_client_secret
      GOOGLE_CALLBACK_URL: http://localhost:5000/api/auth/google/callback

      # =========================
      # Razorpay
      # =========================

      RAZORPAY_KEY_ID: rzp_test_fake_key_id
      RAZORPAY_KEY_SECRET: test_fake_razorpay_key_secret
      RAZORPAY_WEBHOOK_SECRET: test_fake_razorpay_webhook_secret

      # =========================
      # SHREYA AI / GROQ
      # =========================

      AI_PROVIDER: groq
      GROQ_API_KEY: test_fake_groq_key_1234
      GROQ_MODEL: openai/gpt-oss-120b

      # =========================
      # Other AI Provider
      # =========================

      ANTHROPIC_API_KEY: test_fake_anthropic_key_1234
      ANTHROPIC_MODEL: claude-sonnet-4-6

    command: ['npm', 'test']

  # ============================================================
  # Backend
  # ============================================================

  backend:
    build: ./backend

    container_name: flight-optimizer-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_started

    ports:
      - '5000:5000'

    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: http://localhost:3000

      # =========================
      # Database
      # =========================

      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/flight_optimizer
      PG_SSL: 'false'

      # =========================
      # Redis
      # =========================

      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

      # =========================
      # JWT
      # =========================

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 30d

      # =========================
      # Google OAuth
      # =========================

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:5000/api/auth/google/callback}

      # =========================
      # Flight Provider
      # =========================

      FLIGHT_PROVIDER: ignav

      AMADEUS_CLIENT_ID: ${AMADEUS_CLIENT_ID:-}
      AMADEUS_CLIENT_SECRET: ${AMADEUS_CLIENT_SECRET:-}

      IGNAV_API_KEY: ${IGNAV_API_KEY:-}
      IGNAV_BASE_URL: ${IGNAV_BASE_URL:-https://ignav.com/api}
      IGNAV_MARKET: ${IGNAV_MARKET:-IN}

      # =========================
      # SHREYA AI / GROQ
      # =========================

      AI_PROVIDER: ${AI_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}

      # =========================
      # Other AI Provider
      # =========================

      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}

      # =========================
      # Weather
      # =========================

      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}

      # =========================
      # Google Places
      # =========================

      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      PLACES_CACHE_TTL_HOURS: ${PLACES_CACHE_TTL_HOURS:-24}

      # =========================
      # Razorpay
      # =========================

      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}

      # =========================
      # Email
      # =========================

      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@flightoptimizer.app}

      # =========================
      # Sentry
      # =========================

      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}

      # =========================
      # Optimizer
      # =========================

      MAX_NEARBY_AIRPORTS: 3
      MAX_DATE_FLEX_DAYS: 3
      MAX_PERMUTATIONS: 500
      MAX_COUNTRIES_PER_TRIP: 4

      FLIGHT_CACHE_TTL_MINUTES: 20
      STATIC_CACHE_TTL_HOURS: 24

  # ============================================================
  # Frontend
  # ============================================================

  frontend:
    build:
      context: ./frontend

      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}

    container_name: flight-optimizer-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - '3000:3000'

# ==============================================================
# Volumes
# ==============================================================

volumes:
  postgres_data:
  redis_data:
  backend_test_node_modules: