services:
  - type: web
    name: flight-optimizer-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PG_SSL
        value: 'true'
      - key: FLIGHT_PROVIDER
        value: mock
      - key: MAX_NEARBY_AIRPORTS
        value: '3'
      - key: MAX_DATE_FLEX_DAYS
        value: '3'
      - key: MAX_PERMUTATIONS
        value: '500'
      - key: MAX_COUNTRIES_PER_TRIP
        value: '4'
      - key: FLIGHT_CACHE_TTL_MINUTES
        value: '20'
      - key: STATIC_CACHE_TTL_HOURS
        value: '24'
      # Optional error monitoring — set SENTRY_DSN manually in the Render
      # dashboard to enable; leave unset and the app runs exactly as before.
      # SENTRY_ENVIRONMENT defaults to NODE_ENV if left unset.
      # Set these manually in the Render dashboard — deliberately not
      # generated here so a real secret never ends up committed to git:
      # DATABASE_URL, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, FRONTEND_URL
